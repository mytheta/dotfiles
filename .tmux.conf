# C-bのキーバインドを解除する
unbind C-b
unbind C-a

# prefixキーをC-aに変更する
set -g prefix C-j

# キーストロークのディレイを減らす
set -sg escape-time 1

# ウィンドウのインデックスを1から始める
set -g base-index 1

# ペインのインデックスを1から始める
setw -g pane-base-index 1


# 設定ファイルをリロードする
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# C-j*jでtmux内のプログラムにC-aを送る
bind C-j send-prefix

bind c new-window


# | でペインを縦に分割する
bind | split-window -h -c "#{pane_current_path}"

# - でペインを横に分割する
bind - split-window -v -c "#{pane_current_path}"

# Vimのキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Vimのキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# マウス操作を有効にする
setw -g mouse on

# 256色端末を使用する(True color)
set -g status-bg colour213
set -g status-fg black 
setw -g window-status-style bg="default","bright",fg=black
setw -g window-status-current-style bg=blue,"bright",fg=black
# active window title colors
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# OSC 52: tmux内のアプリ(nvim等)のクリップボード要求を、ssh越しでも手元の端末まで転送する
set -s set-clipboard on
set -ag terminal-features ",*:clipboard"

# OSC 8: アプリが出力したハイパーリンクを手元の端末まで通す(折り返したURLも全体がリンクになる)
set -ag terminal-features ",*:hyperlinks"


set-option -g renumber-windows on
# zshのchpwdフックからウィンドウ名を手動で設定するため、tmuxの自動リネームを無効化
set-option -g automatic-rename off
# シェルからのrenameを許可
set-option -g allow-rename on


## リフレッシュの間隔を設定する(デフォルト 15秒)
set -g status-interval 15
set -g status-position top

set-option -g status-right ""

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# editprompt: エディタでプロンプトを書いて隣のペインに送る
# NOTE: mise の PATH は .zshrc にしか無いため tmux から nvim を shims 経由の絶対パスで指定
bind P run-shell '\
  editprompt resume --target-pane #{pane_id} || \
  tmux split-window -v -l 10 -c "#{pane_current_path}" \
    "editprompt open --editor $HOME/.local/share/mise/shims/nvim --always-copy --target-pane #{pane_id}"'
# editprompt: copy-mode で選択した範囲を引用としてバッファに追加
bind-key -T copy-mode-vi C-e send-keys -X pipe "editprompt collect --target-pane #{pane_id}"

# popup の背景は tmux 3.8 以降 themedarkgrey が既定で見にくいので端末の背景色に合わせる
set -g popup-style "bg=default,fg=default"
set -g popup-border-style "bg=default,fg=blue"
set -g popup-border-lines rounded

# aimanager: AIエージェントのセッション一覧を popup で表示(q で閉じる)
# NOTE: editprompt 同様、mise の PATH が無いので shims 経由の絶対パスで指定
bind b display-popup -E -w 85% -h 85% -d "#{pane_current_path}" "$HOME/.local/share/mise/shims/aimanager"

set -s extended-keys on
