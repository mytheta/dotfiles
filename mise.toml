# mise - Declarative CLI Version Manager
# https://mise.jdx.dev/
# ~/.config/mise/config.toml にシンボリックリンクしてグローバル設定として使う。
#
# ツール名の付け方:
#   - mise のレジストリに短縮名があるものはそれを使う（内部的には aqua backend）。
#   - 短縮名が無いものは `aqua:<owner>/<repo>` で aqua レジストリを直接指定する。

[settings]
# .go-version / .node-version などの他ツール用バージョンファイルを mise に
# 解釈させない（nodenv / pyenv / nvm と競合するため）。
idiomatic_version_file_enable_tools = []

[tools]
# Git/GitHub
gh = "2.103.3"
ghq = "1.11.2"
git-chglog = "0.15.4"

# Kubernetes
kubectl = "1.37.2"
kubectx = "0.11.0"
helm = "4.3.1"
kustomize = "5.8.3"
k9s = "0.51.0"
eksctl = "0.231.0"

# Terraform
tfenv = "3.2.2"
tflint = "0.65.0"
tfsec = "1.28.14"
tfmigrate = "0.4.6"

# Go tools
go = "1.27.3"
task = "3.54.0"
golangci-lint = "2.15.0"
buf = "1.75.0"
ko = "0.19.1"
staticcheck = "2026.2"
yamlfmt = "0.21.0"
tbls = "1.96.1"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"aqua:grpc-ecosystem/grpc-gateway/protoc-gen-grpc-gateway" = "2.33.0"
"aqua:grpc-ecosystem/grpc-gateway/protoc-gen-openapiv2" = "2.33.0"
"aqua:incu6us/goimports-reviser" = "3.13.2"
"aqua:cloudspannerecosystem/yo" = "0.11.0"
# aqua レジストリ上で go_install 型のものは aqua backend が非対応なので go backend を使う
"go:go.uber.org/mock/mockgen" = "0.6.0"
"go:github.com/google/wire/cmd/wire" = "0.7.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"
"go:golang.org/x/tools/cmd/goimports" = "0.52.0"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:github.com/cloudspannerecosystem/spanner-cli" = "0.11.2"

# AI コーディングエージェント
codex = "0.152.0"

# General CLI
bat = "0.26.1"
# eza はlibgit2依存のためbrewで管理
fzf = "0.74.5"
jq = "1.8.2"
yq = "4.54.1"
ripgrep = "15.2.0"
direnv = "2.38.2"
starship = "1.27.0"
shellcheck = "0.11.0"
hadolint = "2.15.1"
glow = "3.0.0"
hugo = "0.169.0"
doctl = "2.1.0"
circleci-cli = "1.13.0"
peco = "0.6.0"
duf = "0.9.1"
pinact = "5.0.2"
awscli = { version = "2.39.3", symlink_bins = "true" }
pnpm = "12.16.1"
atlas = "1.3.0"
"aqua:neovim/neovim" = "0.12.6"     # 短縮名 neovim は vfox backend が既定なので aqua を明示
"aqua:bcicen/slackcat" = "1.7.3"
# aqua レジストリ未登録なので github backend で GitHub Releases から取得
"github:tomasz-tomczyk/crit" = { version = "0.23.1", exe = "crit" }
"aqua:context-labs/mactop" = "0.2.7"
"aqua:gitleaks/gitleaks" = "8.30.1"
